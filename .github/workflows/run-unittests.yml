name: Run unit tests
on:
  workflow_call:
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./api

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Composer dependencies
        uses: ./.github/actions/install-composer-dependencies
        with:
          installation-path: api
          include-dev: "true"

      - name: Install npm dependencies
        uses: ./.github/actions/install-npm-dependencies
        with:
          installation-path: api
          include-dev: "true"

      - name: Build Encore files
        run: |
          npm run 'app:build:prod'
          npm run 'mail:build:prod'

      - name: Configure matchers
        uses: mheap/phpunit-matcher-action@v1

      - name: Run unit tests
        run: vendor/bin/phpunit --configuration phpunit.xml.dist --teamcity
