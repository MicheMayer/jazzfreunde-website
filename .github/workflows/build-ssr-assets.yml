name: Build frontend application
on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Reference name of the artifact produced"
        required: true
        type: string

jobs:
  build:
    name: Build SSR assets
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: ./api

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Install Composer dependencies
        uses: ./.github/actions/install-composer-dependencies
        with:
          installation-path: api
          include-dev: "false"

      - name: Install npm dependencies
        uses: ./.github/actions/install-npm-dependencies
        with:
          installation-path: api
          include-dev: "true"

      - name: Install assets
        run: |
          chmod +x bin/console
          bin/console assets:install --env=prod --no-debug

      - name: Build Encore files
        run: |
          npm run 'app:build:prod'
          npm run 'mail:build:prod'

      - name: Generate sitemaps
        run: |
          chmod +x bin/console
          bin/console presta:sitemap:dump --env=prod --no-debug

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.artifact-name }}
          path: api/public/
